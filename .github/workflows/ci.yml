name: ci
concurrency:
  group: ci
  cancel-in-progress: false
  queue: max
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
    - name: Validate the committed dependency snapshot before refreshing
      run: python3 .github/check-first-party.py
    - name: Resolve one fresh dependency snapshot
      run: 'cargo update

        rustc --version > resolver.txt

        cargo --version >> resolver.txt

        date -u +%FT%TZ >> resolver.txt

        sha256sum Cargo.lock >> resolver.txt'
    - uses: actions/upload-artifact@v7
      with:
        name: resolved-lock
        path: 'Cargo.lock

          resolver.txt'
        retention-days: 7
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@v8
      with:
        name: resolved-lock
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
    - run: rustc --version
    - run: cargo fmt --all --check
      id: fmt
    - name: Retain the exact runner formatting patch
      if: failure() && steps.fmt.outcome == 'failure'
      run: 'cargo fmt --all

        git diff --binary > "$RUNNER_TEMP/rustfmt.patch"'
    - uses: actions/upload-artifact@v7
      if: failure() && steps.fmt.outcome == 'failure'
      with:
        name: rustfmt-patch
        path: ${{ runner.temp }}/rustfmt.patch
    - run: cargo clippy --locked --all-targets -- -D warnings
    - run: cargo test --locked
    - run: cargo check --locked --target wasm32-unknown-unknown
    - uses: actions/setup-node@v7
      with:
        node-version: 22
    - name: Install the matching prebuilt wasm test runner
      shell: bash
      run: 'version=$(python3 -c ''import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "wasm-bindgen"))'')

        archive="wasm-bindgen-${version}-x86_64-unknown-linux-musl"

        curl --user-agent cvld-security-review --fail --location --retry 3 "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/${archive}.tar.gz" -o "$RUNNER_TEMP/wasm-bindgen.tar.gz"

        tar -xzf "$RUNNER_TEMP/wasm-bindgen.tar.gz" -C "$RUNNER_TEMP"

        echo "$RUNNER_TEMP/$archive" >> "$GITHUB_PATH"

        '
    - name: Run the same validation and classification tests on wasm
      run: cargo test --locked --target wasm32-unknown-unknown --tests
    needs:
    - resolve
  dependency-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@v8
      with:
        name: resolved-lock
    - run: python3 .github/check-first-party.py
    - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0
      with:
        tool: cargo-deny
    - run: cargo deny --locked check advisories
    needs:
    - resolve
  coverage:
    needs:
    - resolve
    - check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@v8
      with:
        name: resolved-lock
    - uses: dtolnay/rust-toolchain@nightly
      with:
        components: llvm-tools-preview
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: coverage
        cache-on-failure: true
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov
    - run: 'rustc --version

        cargo llvm-cov --version'
    - name: Measure real native round trips and failure paths
      run: cargo llvm-cov --locked --workspace --all-features --branch --no-cfg-coverage --no-cfg-coverage-nightly --ignore-filename-regex '/tests/' --json --output-path coverage.json
    - name: Export exact line and branch locations
      run: cargo llvm-cov report --locked --branch --ignore-filename-regex '/tests/' --lcov --output-path coverage.lcov
    - name: Cross-check emitted line inventory independently
      run: cargo llvm-cov report --locked --branch --ignore-filename-regex '/tests/' --text --output-path coverage.txt
    - name: Require complete line and branch coverage
      run: 'python3 .github/test-source-coverage.py

        python3 .github/check-source-coverage.py coverage.lcov coverage.json coverage.txt'
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: coverage
        path: 'coverage.json

          coverage.lcov

          coverage.txt

          Cargo.lock

          resolver.txt'
        retention-days: 7
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
env:
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: always
