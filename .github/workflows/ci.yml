name: ci
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
    - name: Resolve one fresh dependency snapshot
      run: |-
        cargo update
        rustc --version > resolver.txt
        cargo --version >> resolver.txt
        date -u +%FT%TZ >> resolver.txt
        sha256sum Cargo.lock >> resolver.txt
    - uses: actions/upload-artifact@v4
      with:
        name: resolved-lock
        path: |-
          Cargo.lock
          resolver.txt
        retention-days: 7
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: resolved-lock
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@v2
    - run: rustc --version
    - run: cargo fmt --all --check
    - run: cargo clippy --locked --all-targets -- -D warnings
    - run: cargo test --locked
    - run: cargo check --locked --target wasm32-unknown-unknown
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install the matching prebuilt wasm test runner
      shell: bash
      run: |
        version=$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "wasm-bindgen"))')
        archive="wasm-bindgen-${version}-x86_64-unknown-linux-musl"
        curl --user-agent cvld-security-review --fail --location --retry 3 "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/${archive}.tar.gz" -o "$RUNNER_TEMP/wasm-bindgen.tar.gz"
        tar -xzf "$RUNNER_TEMP/wasm-bindgen.tar.gz" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/$archive" >> "$GITHUB_PATH"
    - name: Run the same validation and classification tests on wasm
      run: cargo test --locked --target wasm32-unknown-unknown --tests
    needs:
    - resolve
  dependency-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: resolved-lock
    - run: python3 .github/check-first-party.py
    - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0
      with:
        tool: cargo-deny
    - run: cargo deny --locked check advisories
    needs:
    - resolve
  coverage:
    needs:
    - resolve
    - check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: resolved-lock
    - uses: dtolnay/rust-toolchain@nightly
      with:
        components: llvm-tools-preview
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: coverage
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov
    - run: |-
        rustc --version
        cargo llvm-cov --version
    - name: Measure real native round trips and failure paths
      run: cargo llvm-cov --locked --workspace --all-features --branch --no-cfg-coverage --no-cfg-coverage-nightly
        --ignore-filename-regex '/tests/' --json --output-path coverage.json
    - name: Export exact line and branch locations
      run: cargo llvm-cov report --locked --branch --ignore-filename-regex '/tests/' --lcov --output-path coverage.lcov
    - name: Require complete line and branch coverage
      run: python3 .github/check-coverage.py coverage.json
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage
        path: |-
          coverage.json
          coverage.lcov
          Cargo.lock
          resolver.txt
        retention-days: 7
'on':
  push:
    branches:
    - '**'
  pull_request: null
  workflow_dispatch: null
env:
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: always
