schema = 1
project = "cshm"

[checks.verify]
kind = "commands"
fleet = true
commands = [
  ["ccid", "first-party"],
  ["cargo", "fmt", "--all", "--check"],
  ["cargo", "clippy", "--locked", "--all-targets", "--", "-D", "warnings"],
  ["cargo", "test", "--locked"],
  ["cargo", "check", "--locked", "--target", "wasm32-unknown-unknown"],
  ["bash", "-c", "set -euo pipefail\nPATH=\"$(ccid toolchain wasm-bindgen):$PATH\" CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER=wasm-bindgen-test-runner cargo test --locked --target wasm32-unknown-unknown --tests"],
  ["ccid", "coverage", "run"],
]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["node", "--version"], ["python3", "--version"], ["rustup", "run", "nightly", "rustc", "-vV"], ["rustup", "run", "nightly", "cargo", "llvm-cov", "--version"]]
cache_outputs = ["coverage.json", "coverage.lcov", "coverage.txt"]

[checks.advisories]
kind = "commands"
commands = [["cargo", "deny", "--locked", "check", "advisories"]]

[render]
render_schema = 2
[jobs.verify]
scheduler = "forgejo"
runs_on = "linux"
checks = ["verify", "advisories"]
workflow = "ci"
command = ["ccid:run-declared-checks"]
events = ["manual"]

[check_shell]

[security]
dependencies = "cargo-deny"

[runtime]
tools = ["nodejs_22", "python3", "cargo-deny", "cargo-llvm-cov"]

[toolchain]
nightly = true
targets = ["stable:wasm32-unknown-unknown"]

