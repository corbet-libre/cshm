schema = 1
project = "cshm"
repository = "https://git.corbet.ch/corbet-foss/cshm.git"

[checks.verify]
kind = "commands"
commands = [["bash", ".ci/verify.sh"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["curl", "--version"], ["node", "--version"], ["python3", "--version"], ["rustup", "run", "nightly", "rustc", "-vV"], ["rustup", "run", "nightly", "cargo", "llvm-cov", "--version"]]
cache_outputs = ["coverage.json", "coverage.lcov", "coverage.txt"]

[checks.advisories]
kind = "commands"
commands = [["cargo", "deny", "--locked", "check", "advisories"]]

[render]
tool_revision = "e38f347d6941aa105ac4b55a0d4b8fec2ef22433"

[jobs.verify]
scheduler = "crow"
checks = ["verify", "advisories"]
workflow = "repository-jobs"
command = ["bash", ".ci/run-cached.sh"]

[push_consumer.cmsg-v01]
consumer = "https://git.corbet.ch/corbet-libs/cmsg.git"
branch = "v01"
consumer_branch = "v01"
job = "v01-push"
self_name = "cshm"
